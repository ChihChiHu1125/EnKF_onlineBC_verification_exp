group_names:
  qc:        EffectiveQC0
  obs:       ObsValue
  hofx:      hofx_y_mean_xb0
  bias:      ObsBias0
  obs_error: ObsError      # diagonal R (σ²_R)

predictors:
  - constant

channels_used: [8, 9, 10, 13]

inflation_factor: 1.0   # prior variance inflation factor for B

data_selection:
  method: default
  cloud_diff_threshold: 5

iteration:
  max_iter: 50    # max number of block-coordinate-descent (dy / dbeta) iterations
  tol: 1.0e-6     # stop when |Δdbeta| (2-norm) drops below this

files:
  # the obsout*.h5 after oberr_inflation (just for convenience, as the original file might not exist because it has been overwritten)
  # Note: it does not need to be the file after oberr_inflation (in fact, it is using ObsError_orig, i.e., original R)
  # if using the direct output from observer, then just change the group_names/obs_error to the correct name!
  obsout:
    - /home/project/17001770/weather_department/dae/hucc/BC_verification_v4/dbOut_ensBC/obsout_da_ahi-cld_himawari9.h5

  # precomputed HBH^T from compute_ensemble_HBHt.py
  # the corresponding _meta.json must exist at the same path
  hbht_input: /home/project/17001770/weather_department/dae/hucc/BC_verification_v4/dbOut_ensBC/HBHT/HBHT_hloc.npy

  satbias_input:  /home/project/17001770/weather_department/dae/hucc/VarBC_stats/initial_satbias_files/satbias_ahi-cld_himawari9_variance_one.h5
  satbias_output: /home/project/17001770/weather_department/dae/hucc/BC_verification_v4/dbOut_ensBC/satbias_iterative_ahi-cld_himawari9.h5
  csv_output:     /home/project/17001770/weather_department/dae/hucc/BC_verification_v4/dbOut_ensBC/satbias_iterative_ahi-cld_himawari9.csv

  # per-iteration beta coefficients (long format: iter, delta, channel, predictor, beta)
  iteration_history_csv: /home/project/17001770/weather_department/dae/hucc/BC_verification_v4/dbOut_ensBC/satbias_iterative_ahi-cld_himawari9_iterhist.csv
