# reduce obs space for regional applications
_reduce obs space: &reduceObsSpace
  filter: Domain Check
  where:
    - variable:
        name: MetaData/latitude
      minvalue: -9.06518
      maxvalue: 11.4725
    - variable:
        name: MetaData/longitude
      minvalue: 91.7506
      maxvalue: 112.268
  action:
    name: reduce obs space

_obs space: &ObsSpace
  obs perturbations seed: 1
  io pool:
    max pool size: 1
    write multiple files: true
  distribution:
    name: RoundRobin

_non-height-based obs localizations: &horizObsLoc
  _blank: null


_obs error diagonal: &ObsErrorDiagonal
  covariance model: diagonal
  zero-mean perturbations: true
  member: 1
  number of members: 1

_clear crtm: &clearCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  linear obs operator:
    Absorbers: [H2O]
  obs options: &CRTMObsOptions
    EndianType: little_endian
    CoefficientPath: /home/project/17001770/weather_department/cmd/ncar/taosun/regional_mpasjedi/CRTM/Coeffs_V2.4/
    IRVISlandCoeff: IGBP

_cloudy crtm: &cloudyCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  Clouds: [Water, Ice, Rain, Snow, Graupel]
  Cloud_Seeding: true
  linear obs operator:
    Absorbers: [H2O]
    Clouds: [Water, Ice, Rain, Snow, Graupel]
  obs options:
    <<: *CRTMObsOptions

_get values: &GetValues
  nnearest: 3


_multi iteration filter: &multiIterationFilter
  apply at iterations: 0,1,2,3,4,5

_iteration: &iterationConfig
  geometry:
    nml_file: namelist.atmosphere_R3km-SG
    streams_file: streams.atmosphere_R3km-SG
    deallocate non-da fields: true
  gradient norm reduction: 1e-20

_member: &memberConfig
  date: &analysisDate 2024-09-16T18:00:00Z
  #state variables: &incvars [spechum,surface_pressure,temperature,uReconstructMeridional,uReconstructZonal, qr, qs, qi, qc, qg]
  state variables: &incvars [water_vapor_mixing_ratio_wrt_moist_air,air_pressure_at_surface,air_temperature,northward_wind,eastward_wind, rain_water, snow_water, cloud_liquid_ice, cloud_liquid_water, graupel]
  stream name: ensemble

output:
  filename: an.$Y-$M-$D_$h.$m.$s.nc
  stream name: analysis

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - <<: *iterationConfig
    diagnostics:
      departures: ombg
    ninner: 60
  #- <<: *iterationConfig
  #  ninner: 60

final:
  diagnostics:
    departures: oman

cost function:
  cost type: 3D-Var
  time window:
    begin: 2024-09-16T17:30:00Z
    length: PT1H
  jb evaluation: false
  geometry:
    nml_file: namelist.atmosphere_R3km-SG
    streams_file: streams.atmosphere_R3km-SG
    deallocate non-da fields: true
  analysis variables: *incvars
  background:
    state variables: [water_vapor_mixing_ratio_wrt_moist_air,air_pressure_at_surface,air_temperature,northward_wind,eastward_wind,air_potential_temperature,dry_air_density,u,w,water_vapor_mixing_ratio_wrt_dry_air,air_pressure,landmask,observable_domain_mask,surface_roughness_length,seaice_fraction,snowc,skin_temperature_at_surface,ivgtyp,isltyp,snowh,vegetation_area_fraction,eastward_wind_at_10m,northward_wind_at_10m,air_temperature_at_2m,water_vapor_mixing_ratio_wrt_moist_air_at_2m,lai,smois,tslb,pressure_p,equivalent_reflectivity_factor,cloud_liquid_water,cloud_liquid_ice,graupel,rain_water,snow_water,cldfrac,re_cloud,re_snow,re_ice]
    filename: bg.2024-09-16_18.00.00.nc
    date: *analysisDate
  background error:
    covariance model: ensemble
    localization:
      localization method: SABER
      saber central block:
        saber block name: BUMP_NICAS
        active variables: *incvars
        read:
          io:
            data directory: /scratch/users/industry/nea/hucc/BC_verification/BUMP_files
            files prefix: bumploc_300km4km
          drivers:
            #multivariate strategy: crossed
            multivariate strategy: duplicated
            read local nicas: true
          model:
            level for 2d variables: last
            #groups:
            #- group name: "large_scale"
            #  variables: [spechum,surface_pressure,temperature,uReconstructMeridional,uReconstructZonal]
            #- group name: "small_scale"
            #  variables: [qc,qi,qg,qr,qs]
    #inflation value: 0.00001
    members from template:
      template:
        <<: *memberConfig
        filename: bg/mem%iMember%/bg.2024-09-16_18.00.00.nc
      pattern: %iMember%
      start: 1
      zero padding: 3
      nmembers: 32

  observations:
    obs perturbations: false
    observers:
    - obs space:
        <<: *ObsSpace
        name: ahi-cld_himawari9
        _obsdatain: &ObsDataIn
          engine:
            type: H5File
            obsfile: /home/project/17001770/weather_department/dae/hucc/BC_verification_v4/dbIn/single_obs_577.h5
        _obsdataout: &ObsDataOut
          engine:
            type: H5File
            obsfile: /home/project/17001770/weather_department/dae/hucc/BC_verification_v4/dbOut_VarBC/obsout_da_ahi-cld_himawari9_single_obs_nobc.h5
        obsdatain: *ObsDataIn
        obsdataout: *ObsDataOut
        simulated variables: [brightnessTemperature]
        channels: &cldahi_himawari9_channels 8,9,10,13
      obs error: *ObsErrorDiagonal
      <<: *horizObsLoc
      obs operator:
        <<: *cloudyCRTMObsOperator
        obs options:
          <<: *CRTMObsOptions
          Sensor_ID: ahi_himawari9
      get values:
        <<: *GetValues


