  # latitude band-specific exclusion heights (m)
  # determined by comparison of |bias| and STD of rltv_omf, excluding where
  # |bias| >~ 1/2 STD
  # note: currently turned off by default, see variational/filters/gnssro{{OPERATOR}}.yaml
  exclusions:
    # The gnssrorefncep exclusions are justified based on cold-start forecasts initialized from GFS
    # analyses.  Above those heights, refractivity bias is negative and larger than STD in places
    # where temperature bias w.r.t. GFS analyses and sondes is negative (too cold).  Same behavior
    # is more pronounced in tropics down to lower altitudes.  Since refractivity ~ P/T, negative
    # refractivity bias should correspond to warm bias at a fixed pressure.  If one of 3D pressure
    # or density is added as analysis variable, will need to revisit this strategy.
    #
    # Refractivity is replaced as the anchor observation above the transition heights.  If not
    # replaced, then do not assimilate higher peaking AMSUA channels when using VarBC.
    # Replacement candidates include gnssrobndmo, gnssrobndropp1d, gnssrobndnbam
    # gnssrobndropp1d: exibits some of the same bias sign and similar magnitude relative to STD as
    #   gnssrorefncep above 25 km; might motivate filtering at some heights (see below)
    # gnssrobndmo (not fully functional): only modifies pressure and moisture; pressure not
    #   compatible with mpas-jedi analysis variables; could use for very small impact on upper
    #   level moisture with pressure fixed, but probably no real advantage
    # gnssrobndnbam: so far unsuccessful in cycling experiments, even for HofX3D
    refncep:
      NPol:
        min: &gnssrorefncepNPolExcludeMin 25000.
        max: &gnssrorefncepNPolExcludeMax 50000.
      NMid:
        min: &gnssrorefncepNMidExcludeMin 12000.
        max: &gnssrorefncepNMidExcludeMax 50000.
      Tro:
        min: &gnssrorefncepTroExcludeMin 11000.
        max: &gnssrorefncepTroExcludeMax 50000.
      SMid:
        min: &gnssrorefncepSMidExcludeMin 13000.
        max: &gnssrorefncepSMidExcludeMax 50000.
      SPol:
        min: &gnssrorefncepSPolExcludeMin 25000.
        max: &gnssrorefncepSPolExcludeMax 50000.

    bndropp1d:
      NPol: # not strictly necessary
        min: &gnssrobndropp1dNPolExcludeMin -99999.
        max: &gnssrobndropp1dNPolExcludeMax -9999.
      NMid:
        min: &gnssrobndropp1dNMidExcludeMin 23000.
        max: &gnssrobndropp1dNMidExcludeMax 26500.
      Tro:
        min: &gnssrobndropp1dTroExcludeMin 17000.
        max: &gnssrobndropp1dTroExcludeMax 28000.
      SMid:
        min: &gnssrobndropp1dSMidExcludeMin 15000.
        max: &gnssrobndropp1dSMidExcludeMax 20000.
      SPol:
        min: &gnssrobndropp1dSPolExcludeMin 28000.
        max: &gnssrobndropp1dSPolExcludeMax 30000.

_hor obs localization: &HorizObsLoc
  localization method: Horizontal Gaspari-Cohn
  lengthscale: &HorizObsLocLengthScale 300000.0
  max nobs: 1000

_hor cloud obs localization: &HorizObsLocCloud
  localization method: Horizontal Gaspari-Cohn
  lengthscale: &HorizObsLocLengthScale 75000.0
  max nobs: 1000

_height-based vertical localization: &HeightVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: 4000.0
  ioda vertical coordinate: height
  ioda vertical coordinate group: MetaData
  localization function: Gaspari Cohn

_pressure-based vertical localization: &PressureVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: 1.0
  ioda vertical coordinate: pressure
  ioda vertical coordinate group: MetaData
  apply log transformation: true
  localization function: Gaspari Cohn

_2DHorizConv: &2DHorizConv
  obs localizations:
  - <<: *HorizObsLoc

_2DHorizCloud: &2DHorizCloud
  obs localizations:
  - <<: *HorizObsLocCloud

_2DPressureConv: &2DPressureConv
  obs localizations:
  - <<: *HorizObsLoc

_2DHeightConv: &2DHeightConv
  obs localizations:
  - <<: *HorizObsLoc

_2DPressureCloud: &2DPressureCloud
  obs localizations:
  - <<: *HorizObsLocCloud

_2DHeightCloud: &2DHeightCloud
  obs localizations:
  - <<: *HorizObsLocCloud

_3DPressureConv: &3DPressureConv
  obs localizations:
  - <<: *HorizObsLoc
  - <<: *PressureVertObsLoc

_3DHeightConv: &3DHeightConv
  obs localizations:
  - <<: *HorizObsLoc
  - <<: *HeightVertObsLoc

_3DPressureCloud: &3DPressureCloud
  obs localizations:
  - <<: *HorizObsLocCloud
  - <<: *PressureVertObsLoc

_3DHeightCloud: &3DHeightCloud
  obs localizations:
  - <<: *HorizObsLocCloud
  - <<: *HeightVertObsLoc

# horizontal localization only
_non-height-based obs localizations: &horizObsLoc
  <<: *2DHorizConv

_non-height-based cloud obs localizations: &horizObsLocCloud
  <<: *2DHorizCloud

# horizontal and vertical localization
_height-based obs localizations: &heightAndHorizObsLoc
  <<: *2DHeightConv

_pressure-based obs localizations: &pressureAndHorizObsLoc
  <<: *2DPressureConv 

_height-based cloud obs localizations: &heightAndHorizObsLocCloud
  <<: *2DHeightCloud

_pressure-based cloud obs localizations: &pressureAndHorizObsLocCloud
  <<: *2DPressureCloud

_round robin dist: &RoundRobinDistribution
  name: RoundRobin

_halo dist: &HaloDistribution
  name: Halo
  halo size: *HorizObsLocLengthScale

_obs space: &ObsSpace
  io pool:
    max pool size: 4
    write multiple files: false
  distribution: *RoundRobinDistribution

_obs error diagonal: &ObsErrorDiagonal
  covariance model: diagonal

_clear crtm: &clearCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  linear obs operator:
    Absorbers: [H2O]
  obs options: &CRTMObsOptions
    EndianType: little_endian
    CoefficientPath: /home/project/17001770/weather_department/cmd/ncar/taosun/regional_mpasjedi/CRTM/Coeffs_V2.4/
    IRVISlandCoeff: IGBP

_cloudy crtm: &cloudyCRTMObsOperator
  name: CRTM
  SurfaceWindGeoVars: uv
  Absorbers: [H2O, O3]
  Clouds: [Water, Ice, Rain, Snow, Graupel]
  Cloud_Seeding: true
  linear obs operator:
    Absorbers: [H2O]
    Clouds: [Water, Ice, Rain, Snow, Graupel]
  obs options:
    <<: *CRTMObsOptions

_get values: &GetValues
  nnearest: 3

_multi iteration filter: &multiIterationFilter
  _blank: null
