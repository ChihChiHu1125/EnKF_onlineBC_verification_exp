
# application-agnostic anchors that specify observation errors
# applicable to Variational, HofX3D

# reduce obs space for regional applications
_regional reduce obs space: &regionalReduceObsSpace
  filter: Domain Check
  where:
    - variable:
        name: MetaData/latitude
      minvalue: -9.06518
      maxvalue: 11.4725
    - variable:
        name: MetaData/longitude
      minvalue: 91.7506
      maxvalue: 112.268  
  action:
    name: reduce obs space

_global reduce obs space: &globalReduceObsSpace
  _blank: null

_reduce obs space: &reduceObsSpace
  *regionalReduceObsSpace

# reusable latitude bands for all observation types
_named latitude bands:
  # 7-band
  NPol:
    min: &minNPol 60.
    max: &maxNPol 90.
  NMid:
    min: &minNMid 30.
    max: &maxNMid 60.
  NTro:
    min: &minNTro  5.
    max: &maxNTro 30.
  ITCZ:
    min: &minITCZ -5.
    max: &maxITCZ  5.
  STro:
    min: &minSTro -30.
    max: &maxSTro  -5.
  SMid:
    min: &minSMid -60.
    max: &maxSMid -30.
  SPol:
    min: &minSPol -90.
    max: &maxSPol -60.

  # 3-band
  NXTro:
    min: &minNXTro 30.
    max: &maxNXTro 90.
  Tro:
    min: &minTro -30.
    max: &maxTro  30.
  SXTro:
    min: &minSXTro -90.
    max: &maxSXTro -30.

